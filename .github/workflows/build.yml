name: Build BypassLogin400
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK + NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;25.2.9519653" "platforms;android-34" "build-tools;33.0.2" "platform-tools"
          echo "NDK=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Zygisk module
        run: |
          set -euxo pipefail
          cd zygisk_module
          $NDK/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk
          mkdir -p zygisk
          cp libs/arm64-v8a/libzygisk.so zygisk/arm64-v8a.so
          cp libs/armeabi-v7a/libzygisk.so zygisk/armeabi-v7a.so
          rm -rf libs obj
          zip -r $GITHUB_WORKSPACE/bypass_login_400.zip module.prop META-INF/ zygisk/
          ls -lh $GITHUB_WORKSPACE/bypass_login_400.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bypasslogin-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bypasslogin-zygisk
          path: bypass_login_400.zip
